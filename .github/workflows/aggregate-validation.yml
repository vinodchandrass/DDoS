name: Reproducibility static and aggregate checks
on:
  push:
    paths:
      - 'results/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/aggregate-validation.yml'
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restrict release contents to reproducibility artifacts
        run: python scripts/check_release_scope.py
      - name: Python syntax compilation
        run: python -m compileall -q scripts tests
      - name: Aggregate consistency and unit tests
        run: |
          python scripts/validate_aggregates.py
          python -m unittest discover -s tests -v
      - name: Install historical diagnostic dependencies
        run: python -m pip install -r requirements.txt
      - name: CLI input contract checks
        run: |
          python scripts/run_frozen_diagnostics.py --help
          python scripts/check_input_hashes.py --help
          python scripts/inspect_dataset_schema.py --help
          python scripts/historical/DDoS_Directionality_Final_Evidence_Audit.py --help
          python scripts/historical/DDoS_Final_Flow_Segmentation_Audit.py --help
          python scripts/historical/DDoS_PCAP_Time_Flow_Reconciliation.py --help
